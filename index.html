<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Web components · diff viewer</title>
    <style>
      :root { color-scheme: dark; background: #0c1016; }
      body { max-width: 1180px; margin: 0 auto; padding: clamp(1rem, 4vw, 3rem); background: #0c1016; color: #eef3f8; font: 1rem/1.5 system-ui, sans-serif; }
      .demo-intro { max-width: 70ch; margin-bottom: 1.5rem; }
      .demo-intro h1 { margin-bottom: .35rem; font-size: clamp(1.7rem, 4vw, 2.8rem); line-height: 1.05; }
      .demo-intro p { color: #aab5c5; }
      .demo-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
      .demo-actions button { border: 1px solid #30394a; border-radius: .55rem; padding: .55rem .75rem; background: #171c26; color: #edf2f7; cursor: pointer; font: inherit; }
      .demo-actions button:focus-visible { outline: 3px solid #f5c76b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="demo-intro">
        <p>Native custom element · shareable bundle</p>
        <h1>A diff viewer that travels with the project.</h1>
        <p>Try the two viewing modes, search, wrapping, copy, and the responsive layout. The example is driven by properties on the custom element rather than a framework runtime.</p>
      </div>
      <div class="demo-actions" aria-label="Demo scenarios">
        <button type="button" id="load-javascript">Load JavaScript</button>
        <button type="button" id="load-unified">Load unified patch</button>
        <button type="button" id="load-adversarial">Load inert text check</button>
      </div>
      <wc-diff-viewer title="Component demo" language="typescript" old-label="Before" new-label="After"></wc-diff-viewer>
    </main>
    <script type="module">
      import '/src/share.ts';

      const viewer = document.querySelector('wc-diff-viewer');
      const javascriptOld = `export function greet(name: string) {\n  return \"Hello, \" + name;\n}\n`;
      const javascriptNew = `export function greet(name: string, punctuation = \"!\") {\n  return \`Hello, \${name}\${punctuation}\`;\n}\n`;
      const unified = `diff --git a/message.ts b/message.ts\n--- a/message.ts\n+++ b/message.ts\n@@ -1,3 +1,4 @@\n-export const message = \"hello\";\n+export const message = \"hello, world\";\n+export const loud = message.toUpperCase();\n export function send() {\n   return message;\n }`;

      function loadTexts(oldText, newText, language = 'typescript') {
        viewer.diffText = '';
        viewer.oldText = oldText;
        viewer.newText = newText;
        viewer.language = language;
      }

      document.querySelector('#load-javascript').addEventListener('click', () => loadTexts(javascriptOld, javascriptNew));
      document.querySelector('#load-unified').addEventListener('click', () => {
        viewer.oldText = '';
        viewer.newText = '';
        viewer.diffText = unified;
        viewer.language = 'typescript';
      });
      document.querySelector('#load-adversarial').addEventListener('click', () => loadTexts('<img src=x onerror=alert(1)>', '<scr' + 'ipt>alert(1)<' + '/script>\nconst safe = true;', 'plaintext'));
      loadTexts(javascriptOld, javascriptNew);
    </script>
  </body>
</html>
