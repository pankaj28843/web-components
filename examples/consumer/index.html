<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>No-bundler consumer fixture</title>
    <style>
      :root { color-scheme: light dark; background: #f6f8fa; }
      body { margin: 0; padding: 1rem; background: #f6f8fa; color: #1f2328; font: 1rem/1.5 system-ui, sans-serif; }
      main { max-width: 1400px; margin: 0 auto; }
      h1 { font-size: 1.4rem; }
      p { color: #656d76; }
    </style>
  </head>
  <body>
    <main>
      <h1>Consumer fixture</h1>
      <p>This page uses the generated IIFE bundle from a plain script tag.</p>
      <wc-diff-viewer title="No-bundler fixture" view="split" old-label="Base" new-label="Changed"></wc-diff-viewer>
    </main>
    <script src="../../dist/share.iife.js"></script>
    <script>
      const viewer = document.querySelector('wc-diff-viewer');
      viewer.diffText = `diff --git a/config/settings.json b/config/settings.json
--- a/config/settings.json
+++ b/config/settings.json
@@ -1,5 +1,6 @@
 {
   "name": "Ada",
-  "enabled": false,
-  "roles": ["reader"]
+  "enabled": true,
+  "roles": ["reader", "reviewer"],
+  "theme": "system"
 }`;
    </script>
  </body>
</html>
