<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>No-bundler consumer fixture</title>
    <style>
      :root { color-scheme: dark; background: #0c1016; }
      body { margin: 0; padding: 1rem; background: #0c1016; color: #eef3f8; font: 1rem/1.5 system-ui, sans-serif; }
      main { max-width: 1400px; margin: 0 auto; }
      h1 { font-size: 1.4rem; }
      p { color: #aab5c5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Consumer fixture</h1>
      <p>This page deliberately uses the generated IIFE bundle from a plain script tag.</p>
      <wc-diff-viewer title="No-bundler fixture" language="json" old-label="Saved" new-label="Incoming"></wc-diff-viewer>
    </main>
    <script src="../../dist/share.iife.js"></script>
    <script>
      const viewer = document.querySelector('wc-diff-viewer');
      viewer.oldText = JSON.stringify({ name: 'Ada', enabled: false, roles: ['reader'] }, null, 2);
      viewer.newText = JSON.stringify({ name: 'Ada', enabled: true, roles: ['reader', 'reviewer'] }, null, 2);
    </script>
  </body>
</html>
